<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Completing sign in | Logto Demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="bg-body-tertiary d-flex align-items-center" style="min-height: 100vh;">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-6">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5 text-center">
              <div class="d-flex flex-column align-items-center gap-3 mb-4">
                <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
                <h1 class="h4 fw-semibold mb-0">Completing your sign-in…</h1>
              </div>
              <div id="callback-alerts"></div>
              <p id="callback-status" class="text-muted mb-4">
                Please wait while we confirm your session.
              </p>
              <a href="/" class="btn btn-outline-primary d-none" id="callback-home">Return home</a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/logto.js"></script>
    <script src="../assets/js/callback.js"></script>
  </body>
</html>
